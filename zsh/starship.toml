"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$ruby\
$python\
$golang\
$time
$status\
$character"""

# Tokyo Night. The terminal background is grey, so low-contrast colors
# (e.g. the theme's comment grey #565f89) are deliberately left out.
palette = 'tokyo'

[palettes.tokyo]
blue   = '#7aa2f7'
yellow = '#e0af68'
green  = '#9ece6a'
red    = '#f7768e'
cyan   = '#7dcfff'
teal   = '#2ac3de'
purple = '#bb9af7'

# Nerd Font glyphs are written as \u escapes: pasting the raw private-use
# characters into this file has silently dropped them before.

[directory]
style = 'bold blue'
format = '[$path]($style)[$read_only]($read_only_style) '
read_only = " \U000F033E"
read_only_style = 'red'
truncation_length = 4
truncation_symbol = '…/'
truncate_to_repo = true

[git_branch]
symbol = "\uE0A0 "
style = 'yellow'
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
style = 'red'
format = '([$all_status$ahead_behind]($style) )'
conflicted = "\uE727 "
ahead      = '⇡${count}'
behind     = '⇣${count}'
diverged   = '⇕⇡${ahead_count}⇣${behind_count}'
untracked  = '?${count}'
stashed    = '*${count}'
modified   = '!${count}'
staged     = '+${count}'
renamed    = '»${count}'
deleted    = '✘${count}'

[nodejs]
symbol = "\uE718 "
style = 'green'
format = '[$symbol($version)]($style) '

[ruby]
symbol = "\uE739 "
style = 'red'
format = '[$symbol($version)]($style) '

[python]
symbol = "\uE73C "
style = 'cyan'
format = '[$symbol($version)( \($virtualenv\))]($style) '

[golang]
symbol = "\uE627 "
style = 'teal'
format = '[$symbol($version)]($style) '

[time]
disabled = false
time_format = '%H:%M'
style = 'purple'
format = '[$time]($style)'

[status]
disabled = false
style = 'red'
symbol = '✘ '
format = '[$symbol$status]($style) '

[character]
success_symbol = '[❯](bold green)'
error_symbol   = '[❯](bold red)'
vimcmd_symbol  = '[❮](bold purple)'

# Also hidden over SSH: this prompt is for a single local machine.
[hostname]
disabled = true

[username]
disabled = true
