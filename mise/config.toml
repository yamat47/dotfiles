[settings]
# Honor .ruby-version / .node-version in projects.
idiomatic_version_file_enable_tools = ["ruby", "node"]

[settings.ruby]
# Use precompiled Ruby builds (jdx/ruby) instead of compiling from source.
compile = false

[tools]
node = "24.15.0"
ruby = "4.0.6"
# Latest Yarn 1.x; projects on Yarn 2+ pin their own via packageManager.
yarn = "1"
# Fallback TypeScript for ts_ls in Neovim (nvim/lua/plugins/lsp-servers.lua).
# Stays on 6: TypeScript 7 ships no tsserver, and a 7 on $PATH would make the
# tsc LSP attach to projects still on older TypeScript.
"npm:typescript" = "6"
"npm:typescript-language-server" = "latest"
